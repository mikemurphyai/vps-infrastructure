services:
  howto:
    image: nginx:1.28.3-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=16m
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=app-net
      - traefik.http.routers.howto.rule=Host(`howto.imurph.com`)
      - traefik.http.routers.howto.entrypoints=websecure
      - traefik.http.routers.howto.tls=true
      - traefik.http.routers.howto.tls.certresolver=mytlschallenge
      - traefik.http.services.howto.loadbalancer.server.port=80

networks:
  app-net:
    external: true
