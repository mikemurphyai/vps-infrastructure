[project]
name = "audio-clips"
version = "0.2.1"
description = "Find coherent excerpts in long audio and export original MP3 clips."
requires-python = ">=3.11"
dependencies = ["openai>=1.75", "python-dotenv>=1.0", "streamlit>=1.45", "pydantic>=2.0", "PyJWT[crypto]>=2.10"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
