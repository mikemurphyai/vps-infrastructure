services:
  obsidian:
    image: lscr.io/linuxserver/obsidian:v1.12.7-ls138
    container_name: obsidian
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      - PUID=1000
      - PGID=1000
      - CUSTOM_RES_W=1920
      - CUSTOM_RES_H=1080
    volumes:
      - obsidian_data:/config
    networks:
      - app-net
    labels:
      - traefik.enable=true
      - traefik.http.routers.${APP_NAME}.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.${APP_NAME}.tls=true
      - traefik.http.routers.${APP_NAME}.entrypoints=web,websecure
      - traefik.http.routers.${APP_NAME}.tls.certresolver=mytlschallenge
      - traefik.http.services.${APP_NAME}.loadbalancer.server.port=${PORT}
      - traefik.http.middlewares.${APP_NAME}-headers.headers.SSLRedirect=true
      - traefik.http.middlewares.${APP_NAME}-headers.headers.STSSeconds=315360000
      - traefik.http.middlewares.${APP_NAME}-headers.headers.browserXSSFilter=true
      - traefik.http.middlewares.${APP_NAME}-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.${APP_NAME}-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.${APP_NAME}-headers.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.${APP_NAME}-headers.headers.STSPreload=true
      - traefik.http.routers.${APP_NAME}.middlewares=${APP_NAME}-headers@docker

# Note: obsidian_data is NOT declared external — Docker Compose manages this volume.
# The actual volume name on the host will be prefixed with the project name
# (e.g., obsidian_obsidian_data). Use 'docker compose down' safely — data is retained.
# Only 'docker compose down -v' would delete it.
volumes:
  obsidian_data:

networks:
  app-net:
    external: true
