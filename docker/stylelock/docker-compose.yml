# Stylelock VPS deployment. Application source is in ./app.
services:
  stylelock:
    build: ./app
    image: stylelock:0.3.0
    pull_policy: never
    env_file: .env
    environment:
      AUTH_MODE: cloudflare
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:?Set the Cloudflare Access team domain}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?Set the Access application audience tag}
    restart: unless-stopped
    volumes:
      - stylelock-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=96m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 128
    networks:
      - app-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=app-net
      - traefik.http.routers.stylelock.rule=Host(`${STYLELOCK_HOSTNAME:?Set the app hostname}`)
      - traefik.http.routers.stylelock.entrypoints=websecure
      - traefik.http.routers.stylelock.tls=true
      - traefik.http.routers.stylelock.tls.certresolver=mytlschallenge
      - traefik.http.services.stylelock.loadbalancer.server.port=8787

networks:
  app-net:
    external: true

volumes:
  stylelock-data:
